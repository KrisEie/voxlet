name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Check public files
        run: python scripts/check_public_files.py
      - name: Test isolated desktop and library behavior
        run: python -m unittest discover -s tests -v
